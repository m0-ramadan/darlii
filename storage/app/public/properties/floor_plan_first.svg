<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Cairo', 'Segoe UI', sans-serif;">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
    <style>
      .room-name { font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .room-dim { font-size: 12px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .wall { fill: #f1f5f9; stroke: #0f172a; stroke-width: 4; stroke-linejoin: round; }
      .inner-wall { stroke: #334155; stroke-width: 3; }
      .door { stroke: #c9933b; stroke-width: 2; fill: none; }
      .window { stroke: #38bdf8; stroke-width: 3; fill: #e0f2fe; }
      .terrace { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4,4; }
      .fixture { stroke: #94a3b8; stroke-width: 1.5; fill: #fff; }
      .title-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect width="1000" height="700" fill="url(#grid2)" />

  <!-- Outer Walls -->
  <path d="M 80 80 L 920 80 L 920 620 L 80 620 Z" class="wall" />

  <!-- Partitions -->
  <line x1="480" y1="80" x2="480" y2="620" class="inner-wall" />
  <line x1="80" y1="350" x2="480" y2="350" class="inner-wall" />
  <line x1="280" y1="80" x2="280" y2="350" class="inner-wall" />
  <line x1="280" y1="350" x2="280" y2="620" class="inner-wall" />

  <!-- Living Room / Family Hall (Right half 480 to 760) -->
  <rect x="500" y="100" width="250" height="350" fill="#fff" rx="4" opacity="0.6" />
  <text x="625" y="250" class="room-name">صالة معيشة عائلية (Family Living)</text>
  <text x="625" y="275" class="room-dim">6.40 م × 4.80 م</text>
  <rect x="580" y="120" width="100" height="60" class="fixture" rx="6" />

  <!-- Terrace on the far right (760 to 920) -->
  <rect x="760" y="84" width="156" height="532" class="terrace" />
  <text x="838" y="330" class="room-name" fill="#b45309">تراس كبير فيو مفتوح</text>
  <text x="838" y="355" class="room-dim" fill="#d97706">9.80 م × 2.60 م</text>

  <!-- Master Suite (Top Left 80 to 280) -->
  <rect x="95" y="95" width="170" height="240" fill="#fff" rx="4" opacity="0.6" />
  <text x="180" y="190" class="room-name">جناح نوم رئيسي (Suite)</text>
  <text x="180" y="215" class="room-dim">4.60 م × 4.20 م</text>
  <rect x="140" y="110" width="80" height="80" class="fixture" rx="4" />
  <rect x="130" y="76" width="100" height="8" class="window" />

  <!-- Bedroom 4 (Top Mid 280 to 480) -->
  <rect x="295" y="95" width="170" height="240" fill="#fff" rx="4" opacity="0.6" />
  <text x="380" y="190" class="room-name">غرفة نوم أطفال (1)</text>
  <text x="380" y="215" class="room-dim">4.20 م × 3.80 م</text>
  <rect x="340" y="110" width="80" height="80" class="fixture" rx="4" />
  <rect x="330" y="76" width="100" height="8" class="window" />

  <!-- Bedroom 5 (Bottom Left 80 to 280) -->
  <rect x="95" y="365" width="170" height="240" fill="#fff" rx="4" opacity="0.6" />
  <text x="180" y="470" class="room-name">غرفة نوم (2)</text>
  <text x="180" y="495" class="room-dim">4.40 م × 3.60 م</text>
  <rect x="140" y="385" width="80" height="80" class="fixture" rx="4" />

  <!-- Bathroom & Dressing (Bottom Mid 280 to 480) -->
  <line x1="280" y1="490" x2="480" y2="490" class="inner-wall" />
  <text x="380" y="435" class="room-name">دريسنج روم</text>
  <text x="380" y="455" class="room-dim">2.40 م × 2.00 م</text>

  <text x="380" y="550" class="room-name">حمام فاخر مع جاكوزي</text>
  <text x="380" y="570" class="room-dim">2.60 م × 2.20 م</text>
  <circle cx="420" cy="560" r="22" class="fixture" />

  <!-- Stairs hint (Bottom Right 500 to 740) -->
  <rect x="500" y="480" width="240" height="125" fill="#fff" rx="4" stroke="#e2e8f0" />
  <text x="620" y="530" class="room-name">صالة التوزيع والسلم الداخلي</text>
  <text x="620" y="555" class="room-dim">درج رخامي بانورامي</text>

  <!-- Title Block / Legend -->
  <rect x="500" y="370" width="240" height="95" class="title-box" />
  <text x="620" y="398" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">المخطط المعماري للدور الأول</text>
  <text x="620" y="420" font-size="12" font-weight="700" fill="#c9933b" text-anchor="middle">المساحة الصافية: 217 م²</text>
  <text x="620" y="440" font-size="11" fill="#64748b" text-anchor="middle">3 غرف نوم | 1 حمام | صالة معيشة + تراس</text>

  <!-- North Arrow -->
  <g transform="translate(880, 120)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="0,-16 6,10 0,6 -6,10" fill="#ef4444" />
    <text x="0" y="-22" font-size="11" font-weight="900" fill="#ef4444" text-anchor="middle">N</text>
  </g>
</svg>