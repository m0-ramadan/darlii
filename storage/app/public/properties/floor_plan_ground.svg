<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Cairo', 'Segoe UI', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
    <pattern id="wall-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#334155" stroke-width="1.5" />
    </pattern>
    <style>
      .room-name { font-size: 15px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .room-dim { font-size: 12px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .dim-line { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4,4; }
      .wall { fill: #f1f5f9; stroke: #0f172a; stroke-width: 4; stroke-linejoin: round; }
      .inner-wall { stroke: #334155; stroke-width: 3; }
      .door { stroke: #c9933b; stroke-width: 2; fill: none; }
      .window { stroke: #38bdf8; stroke-width: 3; fill: #e0f2fe; }
      .fixture { stroke: #94a3b8; stroke-width: 1.5; fill: #fff; }
      .title-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="700" fill="url(#grid)" />

  <!-- Outer Walls -->
  <path d="M 80 80 L 920 80 L 920 620 L 80 620 Z" class="wall" />

  <!-- Outer Dimension Lines -->
  <line x1="80" y1="55" x2="920" y2="55" stroke="#64748b" stroke-width="1.2" />
  <line x1="80" y1="50" x2="80" y2="60" stroke="#64748b" stroke-width="1.5" />
  <line x1="920" y1="50" x2="920" y2="60" stroke="#64748b" stroke-width="1.5" />
  <text x="500" y="48" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">العرض الإجمالي: 18.50 م</text>

  <line x1="50" y1="80" x2="50" y2="620" stroke="#64748b" stroke-width="1.2" />
  <line x1="45" y1="80" x2="55" y2="80" stroke="#64748b" stroke-width="1.5" />
  <line x1="45" y1="620" x2="55" y2="620" stroke="#64748b" stroke-width="1.5" />
  <text x="40" y="350" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" transform="rotate(-90 40 350)">الطول الإجمالي: 12.40 م</text>

  <!-- Zones / Partitions -->
  <!-- Vertical Divider separating Reception from Private Zone -->
  <line x1="520" y1="80" x2="520" y2="620" class="inner-wall" />

  <!-- Reception / Salon Area (Left in LTR, Right 520 to 920) -->
  <!-- Horizontal partition in private zone -->
  <line x1="80" y1="350" x2="520" y2="350" class="inner-wall" />
  <line x1="300" y1="80" x2="300" y2="350" class="inner-wall" />
  <line x1="300" y1="350" x2="300" y2="620" class="inner-wall" />

  <!-- Entrance Hall & Main Corridor -->
  <!-- Doors and openings -->
  <!-- Main Entrance -->
  <rect x="500" y="612" width="70" height="16" fill="#f8fafc" />
  <path d="M 500 620 A 40 40 0 0 1 540 580" class="door" />
  <line x1="500" y1="620" x2="500" y2="580" class="door" stroke-dasharray="2,2" />
  <text x="535" y="645" font-size="11" font-weight="700" fill="#c9933b" text-anchor="middle">المدخل الرئيسي ▼</text>

  <!-- Reception & Salon (Right half) -->
  <rect x="540" y="100" width="360" height="500" fill="#fff" rx="4" opacity="0.6" />
  <text x="720" y="310" class="room-name">صالون واستقبال رئيسي (Reception)</text>
  <text x="720" y="335" class="room-dim">9.20 م × 5.80 م  (3 قطع مفتوحة)</text>

  <!-- Reception Furniture hints -->
  <rect x="600" y="140" width="120" height="50" class="fixture" rx="4" />
  <text x="660" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">طاولة سفرة</text>
  <rect x="780" y="140" width="90" height="50" class="fixture" rx="4" />
  <text x="825" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">أريكة استقبال</text>

  <!-- Reception Windows -->
  <rect x="620" y="76" width="140" height="8" class="window" />
  <rect x="916" y="220" width="8" height="160" class="window" />
  <rect x="750" y="616" width="120" height="8" class="window" />
  <text x="810" y="610" font-size="10" fill="#0284c7" text-anchor="middle">تراس الحديقة</text>

  <!-- Room 1: Master Bedroom (Top Left) -->
  <rect x="100" y="100" width="180" height="230" fill="#fff" rx="4" opacity="0.6" />
  <text x="190" y="200" class="room-name">غرفة نوم رئيسية (Master)</text>
  <text x="190" y="225" class="room-dim">4.60 م × 4.20 م</text>
  <!-- Bed -->
  <rect x="150" y="110" width="80" height="90" class="fixture" rx="3" />
  <text x="190" y="160" font-size="10" fill="#94a3b8" text-anchor="middle">سرير ماستر</text>
  <rect x="130" y="76" width="100" height="8" class="window" />

  <!-- Room 2: Bedroom 2 (Top Mid) -->
  <rect x="320" y="100" width="180" height="230" fill="#fff" rx="4" opacity="0.6" />
  <text x="410" y="200" class="room-name">غرفة نوم (2)</text>
  <text x="410" y="225" class="room-dim">4.40 م × 3.80 م</text>
  <rect x="370" y="110" width="80" height="90" class="fixture" rx="3" />
  <rect x="360" y="76" width="100" height="8" class="window" />

  <!-- Room 3: Kitchen (Bottom Left) -->
  <rect x="100" y="370" width="180" height="230" fill="#fff" rx="4" opacity="0.6" />
  <text x="190" y="470" class="room-name">المطبخ الرئيسي (Kitchen)</text>
  <text x="190" y="495" class="room-dim">4.20 م × 3.60 م</text>
  <path d="M 105 375 L 275 375 L 275 425" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linejoin="round" />
  <rect x="76" y="420" width="8" height="90" class="window" />

  <!-- Bathrooms & Living Corridor (Bottom Mid) -->
  <!-- Bath 1 -->
  <line x1="300" y1="490" x2="520" y2="490" class="inner-wall" />
  <text x="410" y="435" class="room-name">حمام ماستر</text>
  <text x="410" y="455" class="room-dim">2.40 م × 2.00 م</text>
  <rect x="440" y="390" width="40" height="40" class="fixture" rx="10" />

  <!-- Bath 2 (Guest Bath) -->
  <text x="410" y="555" class="room-name">حمام ضيوف</text>
  <text x="410" y="575" class="room-dim">2.40 م × 1.80 م</text>
  <rect x="450" y="530" width="30" height="30" class="fixture" rx="6" />

  <!-- Title Block / Legend -->
  <rect x="640" y="500" width="260" height="100" class="title-box" />
  <text x="770" y="528" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">المخطط المعماري للدور الأرضي</text>
  <text x="770" y="550" font-size="12" font-weight="700" fill="#c9933b" text-anchor="middle">المساحة الصافية: 230 م²</text>
  <text x="770" y="570" font-size="11" fill="#64748b" text-anchor="middle">3 غرف نوم | 2 حمام | ريسبشن 3 قطع</text>
  <text x="770" y="588" font-size="10" fill="#94a3b8" text-anchor="middle">دارلي للتقييم والاستثمار العقاري ©</text>

  <!-- North Arrow -->
  <g transform="translate(880, 120)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="0,-16 6,10 0,6 -6,10" fill="#ef4444" />
    <text x="0" y="-22" font-size="11" font-weight="900" fill="#ef4444" text-anchor="middle">N</text>
  </g>
</svg>